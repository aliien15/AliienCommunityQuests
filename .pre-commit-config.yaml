repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Ensure files end with a new line
      - id: check-yaml
        name: Validate YAML files
      - id: check-case-conflict
        name: Check if any files conflict if ignoring case
      - id: detect-private-key
        name: Check if any private keys are left unignored
      - id: no-commit-to-branch
        name: Check if commits are going to the main branch

  - repo: local
    hooks:
      - id: maven-compile
        name: Verify Maven Compile
        entry: mvn clean test-compile
        language: system
        types: [java]
        pass_filenames: false
