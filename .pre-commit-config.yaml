minimum_pre_commit_version: '3.2.0'
default_install_hook_types: [pre-commit, pre-push]
exclude: '^(target/|\.idea/|dependency-reduced-pom\.xml$)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-xml
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
      - id: pretty-format-java
        args: [--autofix, --aosp, --google-java-formatter-version=1.25.0]

  - repo: local
    hooks:
      - id: maven-verify
        name: Build plugin and check AliienCore integration
        entry: python3 tests/run-checks.py --isolated
        language: system
        files: '^(src/|tests/|pom\.xml$|\.github/workflows/)'
        pass_filenames: false
        require_serial: true
        stages: [pre-push, manual]
